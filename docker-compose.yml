# RateGuard local stack: Caddy -> api -> demo.
#
# Only Caddy publishes ports. api:8080 and demo:8090 stay on the private
# Compose network. Secrets come from .env via env_file; the environment
# block below pins local defaults but allows .env to override them (needed
# for the EC2/DynamoDB deployment).
#
# Usage: docker compose up -d --build

services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
    image: rateguard:${IMAGE_TAG:-local}
    env_file:
      - .env
    environment:
      PORT: "8080"
      STORE_BACKEND: ${STORE_BACKEND:-memory}
      PROXY_UPSTREAM_URL: ${PROXY_UPSTREAM_URL:-http://demo:8090}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Caddy is the only ingress; appends the real client IP to X-Forwarded-For.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    expose:
      - "8080"
    depends_on:
      demo:
        # demo has no healthcheck (distroless has no wget/curl); wait for start.
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/rateguard", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Give the usage flusher time to drain on SIGTERM.
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  demo:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
    image: rateguard:${IMAGE_TAG:-local}
    # The image ENTRYPOINT is the API server, so replace it for the demo.
    entrypoint: ["/app/demo"]
    environment:
      PORT: "8090"
    expose:
      - "8090"
    # Disable the image-level API healthcheck in this container.
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    # Intentionally no cap_drop: the official image binds :80/:443.
    # It is the only service reachable from the host.

volumes:
  caddy_data:
  caddy_config:
