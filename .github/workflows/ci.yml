name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rateguard-deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests (race detector)
        run: go test -race ./...
      - name: Build
        run: go build ./...

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate root (no backend)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - name: Validate bootstrap (local state)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate

  image:
    name: Build, scan, push image
    needs: [test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository variables
        run: |
          if [ -z "${ECR_REPOSITORY_URL}" ]; then
            echo "Set the repository variable ECR_REPOSITORY_URL (Terraform output ecr_repository_url)." >&2
            exit 1
          fi
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "Set the repository variable AWS_ROLE_ARN (Terraform output github_actions_role_arn)." >&2
            exit 1
          fi
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: rateguard:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rateguard:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push SHA and latest tags
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"
          docker tag rateguard:ci "$ECR_REPOSITORY_URL:${{ github.sha }}"
          docker tag rateguard:ci "$ECR_REPOSITORY_URL:latest"
          docker push "$ECR_REPOSITORY_URL:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URL:latest"

  deploy:
    name: Deploy to EC2 and smoke test
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
    steps:
      - name: Verify repository variables
        run: |
          missing=0
          for name in AWS_ROLE_ARN EC2_INSTANCE_ID PUBLIC_HEALTH_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing repository variable $name" >&2
              missing=1
            fi
          done
          exit "$missing"
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy rateguard ${{ github.sha }}" \
            --parameters 'commands=["sudo /opt/rateguard/deploy.sh ${{ github.sha }}"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query Status --output text)
          echo "SSM status: $STATUS"
          test "$STATUS" = "Success"
      - name: Smoke test
        run: |
          HEALTH_URL="${{ vars.PUBLIC_HEALTH_URL }}"
          HEALTH_URL="${HEALTH_URL%/}"
          curl -fsS --retry 15 --retry-delay 4 --retry-connrefused \
            "$HEALTH_URL/healthz"
